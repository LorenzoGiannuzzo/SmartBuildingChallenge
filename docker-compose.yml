# Experiment container: the repository is mounted at /work, so code, data,
# models and results live on the host disk.
#
# Build once:   docker compose build
# Check:        docker compose run --rm sbwm
# Run a module: docker compose run --rm sbwm python -m sbwm.eval_policy ...
services:
  sbwm:
    build:
      context: docker
    image: sbwm:latest
    working_dir: /work
    volumes:
      - .:/work
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    shm_size: "16gb"
    environment:
      - HOME=/tmp
